name: Build YogaFlow 0.8 APK
on:
  push:
    branches: [ yogaflow-prod ]
  workflow_dispatch:

jobs:
  build-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug + release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Android startup diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.yogaflow.yogaapp
            adb shell am start -W -n com.yogaflow.yogaapp/.MainActivity || true
            sleep 4

            adb logcat -d > /tmp/yogaflow-logcat.txt
            echo "===== PROCESS ====="
            adb shell pidof com.yogaflow.yogaapp || true
            echo "===== FATAL / ANDROID RUNTIME ====="
            grep -n -A40 -B10 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.yogaflow.yogaapp|YogaFlowBoot" /tmp/yogaflow-logcat.txt || true
            echo "===== ACTIVITY ====="
            adb shell dumpsys activity activities | grep -A10 -B4 "com.yogaflow.yogaapp" || true

            PID="$(adb shell pidof com.yogaflow.yogaapp 2>/dev/null | tr -d '\r' || true)"
            if [ -z "$PID" ]; then
              exit 1
            fi

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YogaFlow-0.8-logcat
          path: /tmp/yogaflow-logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: YogaFlow-0.8-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
