name: Build YogaFlow 0.8 APK
on:
  push:
    branches: [ yogaflow-prod ]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug + release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Android startup + WebView smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.yogaflow.yogaapp
            adb shell am start -W -n com.yogaflow.yogaapp/.MainActivity
            sleep 3
            adb shell pidof com.yogaflow.yogaapp | grep -E '[0-9]'
            adb shell uiautomator dump /sdcard/yf-native.xml
            adb pull /sdcard/yf-native.xml /tmp/yf-native.xml
            grep -q "YogaFlow AI" /tmp/yf-native.xml
            grep -q "Открыть YogaFlow" /tmp/yf-native.xml
            adb shell input tap 540 1030
            sleep 4
            adb shell pidof com.yogaflow.yogaapp | grep -E '[0-9]'
            adb shell dumpsys activity activities | grep -q "com.yogaflow.yogaapp/.MainActivity"
            adb logcat -d -t 400 > /tmp/yf-logcat.txt
            ! grep -q "FATAL EXCEPTION.*com.yogaflow.yogaapp" /tmp/yf-logcat.txt

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YogaFlow-0.8-smoke-log
          path: /tmp/yf-logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: YogaFlow-0.8-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
