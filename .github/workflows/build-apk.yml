name: Build YogaFlow 0.8 APK
on:
  push:
    branches: [ yogaflow-prod ]
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug + release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Static verify release output
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Android startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euxo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.yogaflow.yogaapp
            adb shell am start -W -n com.yogaflow.yogaapp/.MainActivity
            sleep 2
            PID="$(adb shell pidof com.yogaflow.yogaapp | tr -d '\r')"
            test -n "$PID"

            adb shell uiautomator dump /sdcard/yogaflow.xml
            adb pull /sdcard/yogaflow.xml /tmp/yogaflow.xml
            grep -q "YogaFlow AI" /tmp/yogaflow.xml
            grep -q "Открыть YogaFlow" /tmp/yogaflow.xml

            python3 - <<'PY'
            import re, subprocess
            s=open('/tmp/yogaflow.xml',encoding='utf-8').read()
            nodes=re.findall(r'<node[^>]+>',s)
            node=next((n for n in nodes if 'text="Открыть YogaFlow"' in n),None)
            if not node: raise SystemExit("button not found")
            m=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',node)
            if not m: raise SystemExit("bounds not found")
            x1,y1,x2,y2=map(int,m.groups())
            subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
            PY

            sleep 3
            PID2="$(adb shell pidof com.yogaflow.yogaapp | tr -d '\r')"
            test -n "$PID2"
            adb shell dumpsys activity activities | grep -q "com.yogaflow.yogaapp/.MainActivity"
            adb logcat -d -t 250 > /tmp/logcat.txt
            ! grep -q "FATAL EXCEPTION.*com.yogaflow.yogaapp" /tmp/logcat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: YogaFlow-0.8-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
