name: Build YogaFlow 0.8 APK
on:
  push:
    branches: [ yogaflow-prod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build clean release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release output
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: YogaFlow-0.8-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
