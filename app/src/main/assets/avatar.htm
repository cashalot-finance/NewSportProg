function pose(){return session.poses[st.i]}
function update(){let p=pose();$("#poseName").textContent=p.name;$("#cue").textContent=(p.cues&&p.cues[0])||"Дышите спокойно";$("#idx").textContent=(st.i+1)+"/"+session.poses.length;$("#left").textContent=fmt(p.seconds-st.elapsed)}
function tick(now){let p=pose();if(st.playing)st.elapsed+=(now-st.last)/1000;st.last=now;let pct=clamp(st.elapsed/p.seconds,0,1),phase=((now/1000)%7)/7,breath=phase<.5?Math.sin(phase*Math.PI):Math.sin((1-phase)*Math.PI);$("#breath").textContent=phase<.5?"Вдох":"Выдох";$("#prog").style.width=(pct*100)+"%";$("#left").textContent=fmt(p.seconds-st.elapsed);if(renderer){let a=frame(p.visual),n=session.poses[st.i+1],k=a;if(n&&pct>.72)k=blend(a,frame(n.visual),clamp((pct-.72)/.28,0,1));renderer.render(k,breath)}if(st.elapsed>=p.seconds){if(st.i<session.poses.length-1){st.i++;st.elapsed=0;update()}else{st.playing=false;st.elapsed=p.seconds;$("#play").textContent="Готово"}}st.raf=requestAnimationFrame(tick)}
$("#play").onclick=()=>{st.playing=!st.playing;st.last=performance.now();$("#play").textContent=st.playing?"Пауза":"Продолжить"};$("#prev").onclick=()=>{if(st.i>0){st.i--;st.elapsed=0;update()}};$("#next").onclick=()=>{if(st.i<session.poses.length-1){st.i++;st.elapsed=0;update()}};
$("#close").onclick=()=>{try{if(window.YogaAvatarNative&&YogaAvatarNative.close)return YogaAvatarNative.close()}catch(e){}history.back()};
document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-q]").forEach(x=>x.classList.toggle("on",x===b));st.quality=b.dataset.q;if(renderer)renderer.q=st.quality;$("#render").textContent=st.quality==="high"?"Cinematic High":"Cinematic"});
update();st.raf=requestAnimationFrame(tick);
</script></body></html>
