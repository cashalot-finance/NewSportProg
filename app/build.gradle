plugins { id 'com.android.application' }

android {
    namespace 'com.yogaflow.yogaapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yogaflow.yogaapp'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8.0'
    }

    buildTypes {
        debug { debuggable true; minifyEnabled false }
        release { debuggable false; minifyEnabled false; shrinkResources false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
